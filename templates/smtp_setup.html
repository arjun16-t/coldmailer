{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMTP Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Dashboard + Neumorphic SMTP styles -->
    <link rel="stylesheet" href="{% static 'css/neomorphism.css' %}">
</head>

<body>

<div class="neu-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <!-- Mail icon -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M22 6 12 13 2 6"/>
                        </svg>
                    </div>
                </div>

                <h2>SMTP Setup</h2>
                <p>
                    Your email and app password are used only for the current session
                    and are deleted automatically.
                </p>
            </div>

            <form method="post">
                {% csrf_token %}
                <!-- Email -->
                <div class="form-group">
                    <div class="neu-input">
                        <input
                            type="email"
                            name="email"
                            required
                            autocomplete="email"
                            placeholder=" "
                        >
                        <label>Email address</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- App Password -->
                <div class="form-group">
                    <div class="neu-input password-group">
                        <input
                            type="password"
                            name="password"
                            required
                            minlength="16"
                            maxlength="16"
                            placeholder=" "
                            oninput="this.value = this.value.replace(/\s+/g,'')"
                        >
                        <label>App password (SMTP)</label>

                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </div>

                        <button type="button" class="neu-toggle" onclick="togglePassword(this)">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>

                    <div class="smtp-note">
                        16-character Gmail app password. Not your normal Gmail password.
                    </div>
                </div>

                <button type="submit" class="neu-button">
                    Save & Continue
                </button>
            </form>

            <div class="button-link">
                <p>
                    Need help?
                    <a
                        href="https://support.google.com/accounts/answer/185833"
                        target="_blank" rel="noopener">
                        How to generate a Gmail App Password
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

<script>
function togglePassword(btn) {
    const input = btn.closest('.password-group').querySelector('input');
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.classList.toggle('show-password', !isText);
}
</script>
</body>
</html>
